<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPHERE 接続チェック 2</title>
<style>
  :root{--ok:#2ecc71;--ng:#FF4D2E;--dim:#8a8a8a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:#000;}
  body{background:#000;color:#fff;font-size:16px;line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    padding:26px 18px 70px;}
  h1{font-size:21px;font-weight:700;margin-bottom:4px;}
  .sub{font-size:13px;color:var(--dim);margin-bottom:20px;}
  .grp{font-size:11px;letter-spacing:.18em;color:var(--dim);margin:22px 0 8px;text-transform:uppercase;}
  .t{border:1px solid #262626;background:#0c0c0c;padding:13px 15px;margin-bottom:8px;}
  .t .name{font-size:14.5px;font-weight:600;}
  .t .desc{font-size:11.5px;color:var(--dim);margin-top:1px;word-break:break-all;}
  .t .res{font-size:15px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;}
  .ok{color:var(--ok);} .ng{color:var(--ng);} .wait{color:var(--dim);}
  .verdict{border:1px solid #444;background:#141110;padding:18px;margin-top:24px;font-size:14px;line-height:1.8;}
  .verdict h2{font-size:16px;margin-bottom:8px;}
  .env{border:1px solid #262626;background:#0c0c0c;padding:14px 16px;margin-top:16px;
    font-size:11.5px;color:var(--dim);word-break:break-all;line-height:1.85;}
  .env b{color:#fff;}
  button{margin-top:20px;width:100%;padding:15px;border:1px solid #fff;background:none;
    color:#fff;font-family:inherit;font-size:15px;border-radius:10px;}
  .img{margin-top:8px;width:52px;height:52px;background:#1a1a1a;border-radius:4px;}
</style>
</head>
<body>

<h1>接続チェック 2</h1>
<p class="sub">どの形なら Apple に届くかを総当たりで調べます。自動で始まります。</p>

<div class="grp">検索 — 4通りの形で試す</div>
<div id="searchTests"></div>

<div class="grp">曲情報 — 2通りの形で試す</div>
<div id="lookupTests"></div>

<div class="grp">比較用</div>
<div class="t">
  <div class="name">ジャケット写真（mzstatic）</div>
  <div class="res wait" id="rArt">確認中…</div>
  <img class="img" id="imArt" alt="">
</div>
<div class="t">
  <div class="name">three.js（Apple 以外の通信）</div>
  <div class="res wait" id="rThree">確認中…</div>
</div>

<div class="verdict" id="v"><h2 id="vh">判定中…</h2><div id="vb"></div></div>
<div class="env" id="env"></div>
<button onclick="location.reload(true)">もう一度ためす</button>

<script>
const NEW_S = "https://itunes.apple.com/search";
const OLD_S = "https://itunes.apple.com/WebObjects/MZStoreServices.woa/ws/wsSearch";
const NEW_L = "https://itunes.apple.com/lookup";
const OLD_L = "https://itunes.apple.com/WebObjects/MZStoreServices.woa/ws/wsLookup";

/* 遮断の規則は「/search?term=」のように書かれていることが多い。
   引数の順番を変えるだけで外れることがあるので、両方の並びを試す */
const SEARCH_CASES = [
  {id:"s1", name:"A. 新しい入口・通常の並び",  url:u=>NEW_S+"?term=test&country=JP&media=music&entity=song&limit=1&callback="+u},
  {id:"s2", name:"B. 新しい入口・並べ替え",    url:u=>NEW_S+"?callback="+u+"&country=JP&media=music&entity=song&limit=1&term=test"},
  {id:"s3", name:"C. 旧来の入口・通常の並び",  url:u=>OLD_S+"?term=test&country=JP&media=music&entity=song&limit=1&callback="+u},
  {id:"s4", name:"D. 旧来の入口・並べ替え",    url:u=>OLD_S+"?callback="+u+"&country=JP&media=music&entity=song&limit=1&term=test"}
];
const LOOKUP_CASES = [
  {id:"l1", name:"E. 新しい入口（lookup）",   url:u=>NEW_L+"?id=947748526&country=JP&entity=song&callback="+u},
  {id:"l2", name:"F. 旧来の入口（wsLookup）", url:u=>OLD_L+"?id=947748526&country=JP&entity=song&callback="+u}
];

function card(c, host){
  const d=document.createElement("div"); d.className="t";
  d.innerHTML='<div class="name">'+c.name+'</div>'+
    '<div class="desc">'+c.url("cb").replace(/^https:\/\//,"").slice(0,80)+'…</div>'+
    '<div class="res wait" id="r_'+c.id+'">確認中…</div>';
  document.getElementById(host).appendChild(d);
}
SEARCH_CASES.forEach(c=>card(c,"searchTests"));
LOOKUP_CASES.forEach(c=>card(c,"lookupTests"));

function tryScript(url, cbName){
  return new Promise(res=>{
    const t0=performance.now(); const s=document.createElement("script"); let done=false;
    const fin=(ok,why)=>{ if(done)return; done=true;
      clearTimeout(tm); delete window[cbName]; s.remove();
      res({ok,why,ms:Math.round(performance.now()-t0)}); };
    const tm=setTimeout(()=>fin(false,"時間切れ"),10000);
    window[cbName]=()=>fin(true,"通った");
    s.onerror=()=>fin(false,"拒否された");
    s.src=url; document.head.appendChild(s);
  });
}
const R={};
(async()=>{
  let i=0;
  for(const c of SEARCH_CASES.concat(LOOKUP_CASES)){
    const cb="__c"+(i++);
    const r=await tryScript(c.url(cb), cb);
    R[c.id]=r;
    const el=document.getElementById("r_"+c.id);
    el.className="res "+(r.ok?"ok":"ng");
    el.textContent=(r.ok?"○ ":"× ")+r.why+"（"+r.ms+"ミリ秒）";
  }
  /* 比較用 */
  await new Promise(res=>{
    const t0=performance.now(), im=document.getElementById("imArt"); let done=false;
    const fin=(ok,why)=>{ if(done)return; done=true;
      const ms=Math.round(performance.now()-t0); R.art={ok,ms};
      const el=document.getElementById("rArt"); el.className="res "+(ok?"ok":"ng");
      el.textContent=(ok?"○ ":"× ")+why+"（"+ms+"ミリ秒）"; res(); };
    im.onload=()=>fin(true,"表示できた"); im.onerror=()=>fin(false,"拒否された");
    setTimeout(()=>fin(false,"時間切れ"),10000);
    im.src="https://is1-ssl.mzstatic.com/image/thumb/Music3/v4/fc/5c/44/fc5c4442-ad6e-3866-0b87-fdc913642341/VEATP-31040.jpg/100x100bb.jpg";
  });
  {
    const cb="__t9";
    const r=await new Promise(res=>{
      const t0=performance.now(); const s=document.createElement("script"); let done=false;
      const fin=(ok,why)=>{ if(done)return; done=true; clearTimeout(tm); s.remove();
        res({ok,why,ms:Math.round(performance.now()-t0)}); };
      const tm=setTimeout(()=>fin(false,"時間切れ"),10000);
      s.onload=()=>fin(true,"読み込めた"); s.onerror=()=>fin(false,"拒否された");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
      document.head.appendChild(s);
    });
    R.three=r;
    const el=document.getElementById("rThree"); el.className="res "+(r.ok?"ok":"ng");
    el.textContent=(r.ok?"○ ":"× ")+r.why+"（"+r.ms+"ミリ秒）";
  }

  /* 判定 */
  const okList=Object.keys(R).filter(k=>/^[sl]\d$/.test(k) && R[k].ok);
  const v=document.getElementById("v"), vh=document.getElementById("vh"), vb=document.getElementById("vb");
  if(okList.length===0){
    vh.textContent="Apple への通信が全部止められています";
    vh.style.color="#FF4D2E"; v.style.borderColor="#FF4D2E";
    vb.textContent="この端末では、どの形でも Apple の窓口に届きません。端末全体に効く遮断（VPN型の広告ブロッカー、DNS フィルタ、構成プロファイル、機能制限）が疑われます。画像だけ通っているのは、画像置き場が別のドメインだからです。";
  }else if(R.s1 && !R.s1.ok){
    vh.textContent="通る形が見つかりました";
    vh.style.color="#2ecc71"; v.style.borderColor="#2ecc71";
    vb.textContent="通ったのは "+okList.join(" / ")+" です。この形に切り替えれば検索が動きます。";
  }else{
    vh.textContent="この端末では全部通っています";
    vh.style.color="#2ecc71"; v.style.borderColor="#2ecc71";
    vb.textContent="遮断は起きていません。別の原因を探します。";
  }

  document.getElementById("env").innerHTML=
    "<b>結果まとめ</b>: "+["s1","s2","s3","s4","l1","l2"].map(k=>k+"="+(R[k]&&R[k].ok?"○":"×")).join(" ")+
    "<br><br><b>端末</b>: "+navigator.userAgent+
    "<br><b>回線</b>: "+(navigator.onLine?"オンライン":"オフライン")+
    "<br><b>アドレス</b>: "+location.href;
})();
</script>
</body>
</html>
